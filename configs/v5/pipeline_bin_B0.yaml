# PLAN_v5 S1 파이프라인 설정. dev에서만 조정하고, eval-final 전에 frozen: true로 동결한다. 바꾼 값은 docs/v5/verification.md에 기록.
schema_version: 1
frozen: true   # 2026-11-09 동결 (dev 조정 1: roi_bin만)
units:
  length: m
seed: 0
roi:
  z_min_m: 0.2
  z_max_m: 2.0
roi_bin:   # dev 조정 1 (2026-11-09): 빈 내부 ROI (PLAN_v3 파이프라인 2단계). 벽 윗부분이 위쪽 후보로 먼저 잡히던 문제
  margin_m: 0.008
  z_min_m: 0.003
  z_max_m: 0.30
preprocess:
  voxel_m: 0.004
  outlier_nb: 20
  outlier_std: 2.0
  normal_radius_m: 0.012
  normal_max_nn: 30
plane:
  enabled: true
  distance_m: 0.006
  ransac_n: 3
  iterations: 1000
  min_inlier_frac: 0.15
cluster:
  eps_m: 0.01
  min_points: 10
  min_cluster_points: 30
  min_extent_frac: 0.25
  max_extent_frac: 1.6
  max_candidates: 10
model:
  n_points: 6000
fpfh:
  radius_factor: 5.0
  max_nn: 100
ransac:
  distance_factor: 1.5
  ransac_n: 3
  edge_length: 0.9
  max_iteration: 100000
  confidence: 0.999
  mutual_filter: false
  n_restarts: 5
  min_points: 30
icp:
  coarse_max_corr_m: 0.015
  coarse_max_iter: 30
  fine_max_corr_m: 0.006
  fine_max_iter: 50
confidence:
  min_fitness: 0.6
  max_rmse_m: 0.004
  min_visible_ratio: 0.5
  vis_tol_m: 0.01
symmetry:
  max_sym_disc_step: 0.01
version: v5-B0
source:
  from: configs/v3/pipeline.yaml (기본 프로필, LM-O 프로필 아님)
  note: DBSCAN 분할 + FPFH/RANSAC + ICP, v3 기준선. dev에서만 조정, eval 전 동결
