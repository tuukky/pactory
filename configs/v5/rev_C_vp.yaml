# PLAN_v5 S3 — Rev.C + 비전 피킹 셀 VP (HOUSING: HW → VP → KIT). configs/v2/rev_C.yaml에서 아래만 바꿨다.
#  routing.parts.HOUSING.path [VP], stations.VP (kind vision_pick), layout.nodes VP_IN/VP_1/VP_OUT,
#  VP 셀은 하우징 창고(HW) 옆: 창고 빈에서 바로 집는다(at_source, 입력 = 빈 → 용량 무제한, AGV 없음). VP→KIT는 AGV.
#  operators OP6·OP8 skills += VP (수동 처리). VP 고장은 v2 "other" 등급(MTBF 8 h, MTTR 20 min, 합성).
#  dist_file은 S1·S2 eval 결과로 만든 경험 분포 (개발 중에는 자리표시 분포 → 측정 분포로 바꾼 뒤 동결).
