# v4.2 설정 (YOLO-seg 마스크 + v4.1 정합·신뢰도 검사). 상속 없이 완결 파일. 파이프라인 키는 lmo_baseline.yaml과 같다 (테스트 01).
# color.*, checks.* 는 lmo_v41.yaml 값 그대로 (PLAN_v4 §5.3). 색 순위(top_k)는 dbscan 후보에만 쓰므로 v4.2 주 경로에서는 쓰지 않는다.
# seg.* 융합 값: conf = 합성 val_synth 기준(train_seg.yaml 규칙), erode_px·max_instances_per_class = dev 최소 조정 (tuning_log §3). 2026-10-31 동결 (frozen: true, configs/v4/frozen_manifest.json).
schema_version: 1
frozen: true
units:
  length: m
seed: 0
roi:
  z_min_m: 0.2
  z_max_m: 2.0
preprocess:
  voxel_m: 0.004
  outlier_nb: 20
  outlier_std: 2.0
  normal_radius_m: 0.012
  normal_max_nn: 30
plane:
  enabled: true
  distance_m: 0.015
  ransac_n: 3
  iterations: 1000
  min_inlier_frac: 0.1
cluster:
  eps_m: 0.01
  min_points: 10
  min_cluster_points: 30
  min_extent_frac: 0.25
  max_extent_frac: 1.6
  max_candidates: 20
model:
  n_points: 6000
fpfh:
  radius_factor: 5.0
  max_nn: 100
ransac:
  distance_factor: 1.5
  ransac_n: 3
  edge_length: 0.9
  max_iteration: 100000
  confidence: 0.999
  mutual_filter: false
  n_restarts: 5
  min_points: 30
icp:
  coarse_max_corr_m: 0.015
  coarse_max_iter: 30
  fine_max_corr_m: 0.006
  fine_max_iter: 50
confidence:
  min_fitness: 0.6
  max_rmse_m: 0.004
  min_visible_ratio: 0.5
  vis_tol_m: 0.01
symmetry:
  max_sym_disc_step: 0.01
profile: lmo
version: v42
source:
  from: configs/v4/lmo_v41.yaml (파이프라인·color·checks 동일) + seg (YOLO-seg 융합)
color:
  enabled: true
  models_dir: models
  model_samples: 20000
  similarity: bhattacharyya   # color-rank-diag 선택 (tuning_log §2.1, grid_idx 12)
  top_k: 8                    # k_min = 8 (recall@8/recall@20 = 0.967); replay-tune 선택 8 (tuning_log §2.3)
  min_px: 30
  hist:
    h_bins: 12
    s_bins: 1
    s_min: 45
    achrom_v_bins: 3
    h_smooth_sigma: 0.0
checks:
  enabled: true
  depth:
    tol_match_m: 0.01
    tol_free_m: 0.015           # replay-tune 선택
    max_violation: 0.1          # replay-tune 선택
    min_valid_px: 50
  color_match:
    s_min_model: 40
    s_min_obs: 30
    achrom_s_max_obs: 90
    h_tol: 15
    min_match: 0.6              # replay-tune 선택 (격자 상한값)
    min_px: 50
  visibility_relax:
    enabled: true
    min_vis_relaxed: 0.3        # replay-tune 선택
    min_match_px: 50            # replay-tune 선택
seg:
  source: yolo
  weights: results/v4/seg-train_n/weights/best.pt   # yolo11n-seg 합성 학습 (seg-train_n/train_meta.json)
  weights_sha256: a1ca23be7349a026181fc59008fb03776be11335499cb3e58a10f9feca91d736
  python_exe: 'C:\Users\CEO\anaconda3\envs\pactory-seg\python.exe'
  conf: 0.55                    # 합성 val_synth 클래스 평균 Mask F1 최대 conf 0.5576 (F1 0.977) → 0.05 단위 (results/v4/seg-train_n/val_synth.json)
  predict_conf_floor: 0.05      # 예측 파일 저장 하한 (train_seg.yaml)
  iou: 0.7
  imgsz: 640
  erode_px: 0                   # dev 최소 조정 {0, 2, 4} → 0 (replay-v42 선택, tuning_log §3.4)
  max_instances_per_class: 1    # dev 최소 조정 {1, 3} → 1 (replay-v42 선택, tuning_log §3.4)
  fallback_dbscan: false        # 주 결과·eval-final에서는 끈다 (PLAN_v4 §5.3)
  predictions:
    dev: results/v4/seg-predict_dev   # seg_model predict --split dev (conf ≥ 0.05, 2026-10-31)
runtime:
  omp_num_threads: 16
  cv2_threads: 1
