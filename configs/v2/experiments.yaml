# 모터 공장 v2 공정설계 실험 행렬 (PLAN_v2 §9). 경로는 이 파일 위치 기준.
# 규칙:
#   - study마다 primary_metric을 실행 '전에' 기록한다 (사후 변경 금지).
#   - 후보는 기준 Rev에 대한 단일 변경 (예외: buffer_realloc 총 슬롯 불변, skill_add, machine_add + 레이아웃 노드).
#   - 조합은 단일 변경 결과를 근거로 최대 2개, rationale 필수.
#   - 탐색 시드 100~119로 후보를 고르고, 확인 시드(1단계 1000~1029 / 2단계 2000~2029)는 각 단계 최종 Rev 동결 후 한 번만 쓴다.
experiment_name: motor_factory_design
results_root: ../../results/v2

revisions:
  A: rev_A.yaml
  B: rev_B.yaml   # Rev.A + rev1/H1 (하우징 s 300→800), rev1_explore_20261026T231123_ccc85e7b
  C: rev_C.yaml   # Rev.B + p2_rev1/K45 (키트 슬롯 K 30→45), p2_rev1_explore2_20261026T235927_a71a0e81

# §9.2 변경 용이성 순서 (설계자 가정이며 비용이 아님)
resource_classes:
  rule: 0
  buffer_realloc: 0
  buffer_add: 1
  skill_add: 2
  agv_add: 3
  operator_add: 4
  machine_add: 5

# primary_metric 선정 규칙(실행 전 고정): 직전 진단에서 목표 대비 상대 미달이 가장 큰 목표 지표.
#   상대 미달 = (목표 − 평균)/목표 (리드타임은 (평균 − 목표)/목표).
studies:
  A_diag:
    base_rev: A
    candidates: {}

  # 개정 1 — 근거: A_diag_explore_20261026T231010_32087d3d
  #   상대 미달: 리드타임 1.36 > 납기 0.59 > 수요충족 0.25 → primary = 리드타임
  #   최대 손실: 전 공정 굶주림(66~93%). 원인 = 투입 정지 100% (K 슬롯 가득 64%, 하우징 결품 36%),
  #   S4 하류 막힘 30%(오븐 입력 6칸), 오븐 평균 배치 15.9.
  rev1:
    base_rev: A
    primary_metric: factory.lead_time_cohort_mean_s
    candidates:
      H1: {resource_class: rule, description: "하우징 발주점 s 300→800", overrides: {housing.reorder_point: 800}}
      H2: {resource_class: rule, description: "하우징 발주량 Q 600→1200", overrides: {housing.order_qty: 1200}}
      H3: {resource_class: rule, description: "키트 슬롯 K 30→45", overrides: {release.kit_slots: 45}}
      H4:
        resource_class: buffer_realloc
        description: "버퍼 재배분: S5 입력 6→12, S1·S2 입력 6→3 (총 18 불변)"
        overrides: {stations.S5.input_buffer.capacity: 12, stations.S1.input_buffer.capacity: 3,
                    stations.S2.input_buffer.capacity: 3}
    combinations: {}
  # 개정 1 결과: H1 채택 → Rev.B. Rev.B(=H1)가 탐색 20시드 평균으로 목표 3개를 모두 만족 → §9.2-6 종료 조건.
  # 이후 개정 없음. 최종 Rev = B.

  # 가설 H2~H4 확인용 탐색 (Rev.B 기준). 채택 대상이 아니며 최종 Rev를 바꾸지 않는다(§14 게이트).
  # 근거: Rev.B 손실 분해에서 S5 오븐 가공 61%·DOWN 5.5%, S4 하류 막힘 31% (오븐 앞), R1 준비 3.9%.
  hyp_B:
    base_rev: B
    primary_metric: factory.lead_time_cohort_mean_s
    candidates:
      FAM_R1: {resource_class: rule, description: "R1 디스패칭 FIFO→FAMILY", overrides: {stations.R1.dispatch: FAMILY}}
      FAM_S3: {resource_class: rule, description: "S3 디스패칭 FIFO→FAMILY", overrides: {stations.S3.dispatch: FAMILY}}
      EDD_FA: {resource_class: rule, description: "FA 디스패칭 FIFO→EDD", overrides: {stations.FA.dispatch: EDD}}
      BUF_PRE:
        resource_class: buffer_realloc
        description: "병목(오븐) 앞 집중: S5 입력 6→12, S1·S2 입력 6→3 (총 18 불변)"
        overrides: {stations.S5.input_buffer.capacity: 12, stations.S1.input_buffer.capacity: 3,
                    stations.S2.input_buffer.capacity: 3}
      BUF_FAR:
        resource_class: buffer_realloc
        description: "대조군 비병목 집중: R2 입력 6→12, S1·S2 입력 6→3 (총 18 불변)"
        overrides: {stations.R2.input_buffer.capacity: 12, stations.S1.input_buffer.capacity: 3,
                    stations.S2.input_buffer.capacity: 3}
    combinations: {}

  # 최종 확인 (§9.5): 확인 시드 1000~1029. Rev.A는 base 조건만, 최종 Rev는 4조건.
  final:
    base_rev: A
    baseline_conditions: [base]
    candidates:
      FINAL: {rev: B, resource_class: rule, description: "최종 Rev.B"}
    combinations: {}

  # ===================== 2단계 증산 설계 (PLAN_v2 §17, 2026-10-27 사전 등록) =====================
  # 질문: 수요 20.7대/h를 감당하는 공정 구성. 출발 Rev.B. 목표·규칙은 1단계와 동일.
  # 기준 조건 p2_base(20.7대/h), 탐색 explore2(시드 100~119), 확인 confirm2(시드 2000~2029).
  p2_diag:
    base_rev: B
    candidates: {}

  # 2단계 개정 1 — 근거: p2_diag_explore2_20261026T235640_e668f300 (Rev.B @20.7)
  #   상대 미달: 수요충족 0.019 (0.961) / 납기 0.993·리드타임 32,382s는 만족 → primary = 수요충족
  #   최대 손실: 투입 정지 100% (K 가득, 결품 0), S4 하류 막힘 46.7% (오븐 앞), 오븐 가공 61.5%·형성/굶주림 30.8%,
  #   R1 가공 35.9%·작업자 대기 4.9%. 작업자 최대 50%, AGV 65%.
  p2_rev1:
    base_rev: B
    primary_metric: factory.demand_fulfil_ratio
    candidates:
      K45: {resource_class: rule, description: "키트 슬롯 K 30→45", overrides: {release.kit_slots: 45}}
      OVW450: {resource_class: rule, description: "오븐 최대 형성 대기 900→450s", overrides: {stations.S5.batch.max_wait_s: 450}}
      BUF_S5:
        resource_class: buffer_realloc
        description: "버퍼 재배분: S5 입력 6→12, S1·S2 입력 6→3 (총 18 불변)"
        overrides: {stations.S5.input_buffer.capacity: 12, stations.S1.input_buffer.capacity: 3,
                    stations.S2.input_buffer.capacity: 3}
      OVEN2:
        resource_class: machine_add
        description: "오븐 S5 +1대 (2대)"
        overrides: {stations.S5.machines: 2, layout.nodes.S5_2: [38, 24]}
    combinations: {}
  # 2단계 개정 1 결과: K45 채택(순위 0, 적격 3개 중 순위 최소 동률 → 개선 폭 최대) → Rev.C.
  # Rev.C(=K45)가 탐색 20시드 평균으로 목표 3개를 모두 만족 → 종료. 2단계 최종 Rev = C.

  # 2단계 최종 확인 (§17.1): 확인 시드 2000~2029. Rev.B는 p2_base만, Rev.C는 4조건.
  p2_final:
    base_rev: B
    baseline_conditions: [p2_base]
    candidates:
      FINAL: {rev: C, resource_class: rule, description: "2단계 최종 Rev.C"}
    combinations: {}

conditions:
  base: {overrides: {}}
  demand_p15: {overrides: {demand.rate_per_h: 20.7}}
  aging: {overrides: {failures.mtbf_scale: 0.5}}
  mix_c:
    overrides: {products.groups.A.share: 0.3, products.groups.C.share: 0.4}
    comparable_to_base: false   # 주문 집합이 달라 짝 비교로 해석하지 않음 (D27)

  # 2단계 조건 (§17.1): 수요 20.7대/h 기준
  p2_base: {overrides: {demand.rate_per_h: 20.7}}
  p2_demand_p15: {overrides: {demand.rate_per_h: 23.8}}
  p2_aging: {overrides: {demand.rate_per_h: 20.7, failures.mtbf_scale: 0.5}}
  p2_mix_c:
    overrides: {demand.rate_per_h: 20.7, products.groups.A.share: 0.3, products.groups.C.share: 0.4}
    comparable_to_base: false

phases:
  explore: {seeds: {start: 100, count: 20}, conditions: [base]}
  # 가설 검증 보조: 탐색 시드로 수요 +15% 부하에서 hyp_B를 다시 본다 (Rev.B는 기본 수요에서 여유가 커서
  # 규칙·버퍼 차이가 드러나지 않음). 확인 시드는 쓰지 않으며 설계 선택에 쓰지 않는다.
  explore_stress: {seeds: {start: 100, count: 20}, conditions: [demand_p15]}
  confirm: {seeds: {start: 1000, count: 30}, conditions: [base, demand_p15, aging, mix_c]}

  explore2: {seeds: {start: 100, count: 20}, conditions: [p2_base]}
  confirm2: {seeds: {start: 2000, count: 30}, conditions: [p2_base, p2_demand_p15, p2_aging, p2_mix_c]}

final_rev: B   # 1단계 동결 (rev1에서 목표 달성으로 종료)
final_rev_phase2: C   # 2단계 동결 (p2_rev1에서 목표 달성으로 종료)
